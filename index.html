<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn English - Inglizcha Oʻzbekcha Tarjimon</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 650px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
        }
        .text-boxes {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 600;
            color: #555;
            margin-bottom: -5px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease;
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Inglizcha - Oʻzbekcha Tarjimon</h2>
    <div class="text-boxes">
        <label for="inputText">Inglizcha matn:</label>
        <textarea id="inputText" placeholder="Inglizcha matn kiriting..."></textarea>
        
        <button onclick="translateText()">Tarjima qilish</button>
        
        <label for="outputText">Oʻzbekcha tarjimasi:</label>
        <textarea id="outputText" placeholder="Tarjima bu yerda chiqadi..." readonly></textarea>
    </div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value;
        const output = document.getElementById('outputText');

        if (!text.trim()) {
            output.value = "Iltimos, matn kiriting!";
            return;
        }

        output.value = "Tarjima qilinmoqda...";

        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|uz`);
            const data = await response.json();
            
            if (data.responseData) {
                let translated = data.responseData.translatedText;
                
                // HTML belgilarni (masalan &#39; larni) to'g'rilash
                let parser = new DOMParser();
                let decodedString = parser.parseFromString(translated, 'text/html').body.textContent;
                
                output.value = decodedString;
            } else {
                output.value = "Tarjima qilishda xatolik yuz berdi.";
            }
        } catch (error) {
            output.value = "Tarmoq xatosi yoki API javob bermadi.";
        }
    }
</script>

</body>
</html>
