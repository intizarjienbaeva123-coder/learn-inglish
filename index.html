<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlayn Tarjimon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .text-boxes {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Inglizcha - Oʻzbekcha Tarjimon</h2>
    <div class="text-boxes">
        <textarea id="inputText" placeholder="Inglizcha matn kiriting..."></textarea>
        <button onclick="translateText()">Tarjima qilish</button>
        <textarea id="outputText" placeholder="Oʻzbekcha tarjimasi bu yerda chiqadi..." readonly></textarea>
    </div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value;
        const output = document.getElementById('outputText');

        if (!text.trim()) {
            output.value = "Iltimos, matn kiriting!";
            return;
        }

        output.value = "Tarjima qilinmoqda...";

        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|uz`);
            const data = await response.json();
            
            if (data.responseData) {
                output.value = data.responseData.translatedText;
            } else {
                output.value = "Tarjima qilishda xatolik yuz berdi.";
            }
        } catch (error) {
            output.value = "Tarmoq xatosi yoki API javob bermadi.";
        }
    }
</script>

</body>
</html>
